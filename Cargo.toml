[package]
name = "liaison"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
futures-util = "0.3.34"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
